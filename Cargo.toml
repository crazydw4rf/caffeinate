[package]
name = "caffeinate-rs"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "caffeinate"
path = "./src/main.rs"

[dependencies]
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
